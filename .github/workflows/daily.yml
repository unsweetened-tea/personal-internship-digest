name: daily-internship-digest

on:
  schedule:
    # Fires at 12:00 PM (noon) Eastern. GitHub cron is ALWAYS UTC and does NOT
    # follow daylight saving, so pick the line for your zone / season:
    #   noon EDT (summer, now):  16   |  noon EST (winter):  17
    #   noon PDT (summer):       19   |  noon PST (winter):  20
    # In Nov, bump this by 1 (16 -> 17) to stay at local noon.
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: write         # needed to commit the updated data/seen.json

# Never let two runs (e.g. the scheduled one and a manual one) overlap and race
# each other's push. A second run waits for the first to finish.
concurrency:
  group: digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python -m src.main

      - name: Persist seen jobs
        run: |
          if git diff --quiet -- data/seen.json; then
            echo "No change to seen.json"; exit 0
          fi
          git config user.name  "unsweetened-tea"
          git config user.email "128762088+unsweetened-tea@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          # Retry loop: merge with whatever is on the remote right now, then push.
          # Handles the case where another run or push advanced the branch while
          # this job was working (which otherwise rejects the push).
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git show "origin/$branch:data/seen.json" > /tmp/remote_seen.json 2>/dev/null || echo '{}' > /tmp/remote_seen.json
            python scripts/merge_seen.py /tmp/remote_seen.json
            git reset --mixed "origin/$branch" >/dev/null   # base on latest remote tip
            git add data/seen.json
            if git diff --cached --quiet; then
              echo "seen.json already current on remote"; exit 0
            fi
            git commit -m "chore: update seen jobs [skip ci]"
            if git push origin "HEAD:$branch"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt rejected; re-merging with remote and retrying..."
            sleep 3
          done
          echo "ERROR: could not push seen.json after 5 attempts"; exit 1
