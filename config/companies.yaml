# Companies to track via their public Applicant Tracking System (ATS) job boards.
# These endpoints are the same public JSON the companies' own careers pages use.
#
# How to find a company's token:
#   Greenhouse: careers URL like boards.greenhouse.io/<token>  -> use <token>
#   Lever:      jobs.lever.co/<company>                        -> use <company>
#   Ashby:      jobs.ashbyhq.com/<token>                       -> use <token>
#
# Add/remove freely. Grouped by industry only for your own readability.

# NOTE: tokens are best-effort — a wrong one just 404s and is skipped harmlessly.
# Verify a company's token by opening its careers page and checking the ATS URL.

greenhouse:
  # tech
  - stripe
  - databricks
  - airbnb
  - cloudflare
  # finance / fintech / quant
  - robinhood
  - twosigma
  - brex
  - affirm
  - sofi
  # medical / health / biotech
  - tempus
  - benchling
  - devoted
  # consulting / analytics
  - clarity-ai

lever:
  - ramp
  - plaid           # fintech

ashby:
  - openai
  - ramp            # some companies list on multiple ATSs; dedupe handles it
  - hex             # analytics
