# Curated discovery / insight programs.
#
# Hand-picked early-career programs at firms whose own sites don't publish a
# machine-readable feed, so they can't be scraped. Entries here BYPASS the
# topic/location/recency filters (you curated them) and are labeled "Discovery".
#
# Fields: company, title, url  (required) | location, topic, opens, closes, recurring_days
#   topic groups it in the email; one of:
#   machine_learning | data_science | statistics | quant_finance | health_data | software_engineering
#
# Recurrence behavior (curated programs only — never internships):
#   - No window (no opens/closes): the program shows ONCE.
#   - With an application window (opens/closes, ISO dates YYYY-MM-DD): it shows
#     once, then stays quiet until the window opens; while OPEN it repeats every
#     `recurring_days` days (default 7) until `closes`, then goes quiet again.
#   Omit closes for an open-ended window. `recurring_days: 0` forces show-once.
#
# ⚠️ The opens/closes dates below are ESTIMATES for the 2026-27 (Summer 2027)
# cycle, extrapolated from each firm's prior-year dates. Firms shift these yearly
# and some recruit on a rolling basis — verify on the linked page and correct as
# you learn the real dates. URLs verified 2026-08.

